    <div>
      <h1>CÉRBERO <span>ATIVIDADE</span></h1>
      <p>Simulação paper · dinheiro fictício · sem ordens reais</p>

  <nav class="tabs" aria-label="Abas">

  <footer class="dash-foot" id="foot"></footer>
